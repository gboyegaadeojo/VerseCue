name: Native Mac development download
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  VERSECUE_AUTOMATION: "1"
jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            label: apple-silicon
          - runner: macos-15-intel
            arch: x64
            label: intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install pinned Electron runtime
        run: node node_modules/electron/install.js
      - run: npm test && npm run check
      - name: Check reference-driven desktop workflow against synthetic targets
        run: |
          node scripts/test-booth-readability.cjs
          node scripts/test-safe-input-test.cjs
          node scripts/test-speech-scratch-recovery.cjs
          node scripts/test-audio-input-information-ui.cjs
          node scripts/test-passage-range-ui.cjs
          node scripts/test-reference-cooldown-ui.cjs
          node scripts/test-reference-diagnostics.cjs
          node scripts/test-reset-inflight-receipt.cjs
          node scripts/test-session-reset-privacy.cjs
          node scripts/test-provisional-speech.cjs
          node scripts/test-loopback-input-guidance.cjs
          node scripts/test-start-in-auto.cjs
          node scripts/test-route-workspace.cjs
          node scripts/test-hold-shortcut.cjs
          node scripts/test-update-check.cjs
          node scripts/test-audio-loss-auto.cjs
          node scripts/test-settings-recovery-ui.cjs
          node scripts/test-settings-transition-ui.cjs
          node scripts/test-reference-passage-ui.cjs
          node scripts/test-arranged-passage-ui.cjs
          node scripts/test-next-verse-ui.cjs
          node scripts/test-audio-age.cjs
          node scripts/test-passage-copy-choice.cjs
          node scripts/test-listening-preparation.cjs
          node scripts/test-api-passage-review.cjs
          node scripts/test-citation-stabilization.cjs
          node scripts/test-detected-native-preparation.cjs
          node scripts/test-detected-native-preparation.cjs --no-input
          node scripts/test-detected-native-preparation.cjs --clipped
          node scripts/test-detected-native-preparation.cjs --recover
          node scripts/test-detected-native-preparation.cjs --uncertain
          node scripts/test-detected-native-preparation.cjs --output-edit
          node scripts/test-slide-preview.cjs
          node scripts/test-saved-lookup-speech.cjs
          node scripts/test-managed-copy-ledger.cjs
          node scripts/test-guarded-auto.cjs
          node scripts/test-guarded-auto.cjs --bare-citations
          node scripts/test-normal-auto-approval.cjs
          node scripts/test-normal-auto-approval.cjs --changed-look
      - name: Build pinned Metal (Apple GPU) local speech
        run: |
          git clone https://github.com/ggml-org/whisper.cpp.git .cache/whisper-source
          git -C .cache/whisper-source checkout d1be6fde11ac6e0407606b4e42fe72d34add8037
          cmake -S .cache/whisper-source -B .cache/whisper-build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DGGML_BLAS=OFF -DGGML_NATIVE=OFF -DWHISPER_BUILD_TESTS=OFF
          cmake --build .cache/whisper-build --config Release -j 3 --target whisper-cli whisper-server
          mkdir -p .cache/mac-speech
          cp .cache/whisper-build/bin/whisper-cli .cache/whisper-build/bin/whisper-server .cache/mac-speech/
          curl --fail --location --retry 2 https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin -o .cache/mac-speech/ggml-base.en.bin
          echo 'a03779c86df3323075f5e796cb2ce5029f00ec8869eee3fdfb897afe36c6d002  .cache/mac-speech/ggml-base.en.bin' | shasum -a 256 --check
          curl --fail --location --retry 2 https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin -o .cache/mac-speech/ggml-large-v3-turbo-q5_0.bin
          echo '394221709cd5ad1f40c46e6031ca61bce88931e6e088c188294c6d5a55ffa7e2  .cache/mac-speech/ggml-large-v3-turbo-q5_0.bin' | shasum -a 256 --check
      - name: Build the experimental Mac Bible helper
        run: |
          mkdir -p .cache/mac-native
          swiftc -O -framework Cocoa -framework ApplicationServices -o .cache/mac-native/VerseCue.BibleBridge native/macos/BibleBridge.swift
          echo '{"operation":"bogus"}' | .cache/mac-native/VerseCue.BibleBridge | grep -q UNKNOWN_OPERATION
      - name: Package and locally sign development app
        run: node scripts/package-macos.cjs
      - name: Check native packaged workspace
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          node scripts/test-workspace.cjs "dist/VerseCue-$APP_VERSION-darwin-${{ matrix.arch }}/VerseCue.app/Contents/MacOS/Electron"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VerseCue-mac-${{ matrix.label }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.sha256
            test-results/figma-workspace.json
          retention-days: 1
          if-no-files-found: error
